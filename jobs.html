<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="description" content="Listado con empleos" />
    <title>Empleos</title>
</head>
<script type="module" src="main.js"></script>

<body>
    <header>
        <h1>
            <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            DevJobs
        </h1>
        <nav>
            <a href="index.html" target="_self" rel="noopener noreferrer">Inicio</a>
            <a href="#" target="_self" rel="noopener noreferrer">Empleos</a>
            <a href="#" target="_self" rel="noopener noreferrer">Empresas</a>
            <a href="#" target="_self" rel="noopener noreferrer">Salarios</a>
        </nav>
        <div id="profile_img_container">
            <button>Subir CV</button>

            <devjobs-avatar service="x" username="marc" size="32">

            </devjobs-avatar>

        </div>

    </header>
    <main>
        <section class="results">
            <header class="jobs-hero">
                <h1>Encuentra tu próximo trabajo</h1>
                <p>
                    Explora miles de oportunidades en el sector tecnologico
                </p>
                <form id="serch-job" role="search">
                    <div class="search-box">
                        <svg xmlns=" http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-search">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                            <path d="M21 21l-6 -6" />
                        </svg>
                        <input type="text" placeholder="Busca trabajos, empresas o habilidades" />
                    </div>
                    <div>
                        <select id="filter-technology" name="select">
                            <option value="js">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                            <option value="react">React</option>
                            <option value="node">Node.js</option>
                        </select>
                        <select id="filter-location" name="select">
                            <option value="value1">Ubicación</option>
                            <option value="remote">Remoto</option>
                            <option value="barcelona">Barcelona</option>
                            <option value="madrid">Madird</option>
                        </select>
                        <select name="select">
                            <option value="value1">Tipo de contrato</option>
                        </select>
                        <select name="select">
                            <option value="value1">Nivel de experiencia</option>
                        </select>
                    </div>
                </form>
            </header>
            <footer class="jobs-results">
                <h3>Resultados de busqueda</h3>
            </footer>
        </section>

    </main>

    <footer id="footer">
        <nav class="pagination">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-left">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M15 6l-6 6l6 6" />
            </svg>
            <a class="is-active" href="#"> 1 </a>
            <a href="#"> 2 </a>
            <a href="#"> 3 </a>
            <a href="#"> 4 </a>
            <a href="#"> 5 </a>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-right">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M9 6l6 6l-6 6" />
            </svg>
        </nav>
    </footer>

</body>
<footer id="footer">
    <small>&copy; 2026 DevJobs. Todos los derechos reservados.</small>
</footer>

</html>
